name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/Crest/Crest.csproj -c Release -warnaserror:CS0108,CS0114,CS4014

      - name: Publish — standalone single exe (no .NET needed)
        run: >
          dotnet publish src/Crest/Crest.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/standalone

      - name: Publish — small exe (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/Crest/Crest.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o out/small

      - name: Smoke test — run the app, tour every view, screenshot it
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\Crest" -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "out/standalone/Crest.exe" -ArgumentList "--tour", "$PWD/shots" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; Write-Host "::warning::tour timed out" }
          Write-Host "exit code: $($p.ExitCode)"
          $log = "$env:APPDATA\Crest\crest.log"
          if (Test-Path $log) { Copy-Item $log shots/crest.log; Get-Content $log }
          $shots = @(Get-ChildItem shots -Filter *.png -ErrorAction SilentlyContinue)
          Write-Host "screenshots: $($shots.Count)"
          if ($shots.Count -lt 15) { Write-Host "::error::expected at least 15 screenshots"; exit 1 }
          if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'fatal:|ui: |view \w+: |tour: System\.|capture \S+: ')) { Write-Host "::error::runtime errors in crest.log"; exit 1 }

      - name: Demo video (on request) — scripted walkthrough recorded with ffmpeg
        if: contains(github.event.head_commit.message, '[demo]')
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "resolution unchanged: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; Write-Host "screen: $($b.Width)x$($b.Height)"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null; $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path" }
          Remove-Item "$env:APPDATA\Crest" -Recurse -Force -ErrorAction SilentlyContinue
          $ff = Start-Process ffmpeg -ArgumentList '-y','-f','gdigrab','-framerate','30','-draw_mouse','1','-t','120','-i','desktop','-c:v','libx264','-preset','veryfast','-crf','21','-pix_fmt','yuv420p','demo-raw.mp4' -PassThru -NoNewWindow -RedirectStandardError ff.log
          Start-Sleep 2
          $p = Start-Process "out/standalone/Crest.exe" -ArgumentList "--demo" -PassThru
          if (-not $p.WaitForExit(170000)) { Stop-Process $p -Force; Write-Host "::warning::demo timed out" }
          if (-not $ff.WaitForExit(60000)) { Stop-Process $ff -Force }
          Get-Content ff.log -Tail 5
          Get-Content "$env:APPDATA\Crest\crest.log" -ErrorAction SilentlyContinue | Select-String "demo|error|Exception"
          if (-not (Test-Path demo-raw.mp4)) { Write-Host "::error::no video"; exit 1 }
          Write-Host "video bytes: $((Get-Item demo-raw.mp4).Length)"
          # publish on a separate orphan branch so the main history stays small
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "media"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item demo-raw.mp4 $tmp/demo-raw.mp4
          Push-Location $tmp
          git init -q -b media
          git add demo-raw.mp4
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Demo video"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

      - name: Commit screenshots to docs/ (on request)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          Copy-Item shots/*.png docs/screenshots/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Update screenshots [skip ci]"; git push }
          exit 0

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/standalone/Crest.exe dist/Crest-win-x64.exe
          Copy-Item out/small/Crest.exe dist/Crest-win-x64-small.exe
          Compress-Archive -Path out/standalone/Crest.exe, README.md, LICENSE -DestinationPath dist/Crest-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crest-win-x64
          path: dist/

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/Crest/Crest.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Crest ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Crest-win-x64.exe
            dist/Crest-win-x64-small.exe
            dist/Crest-win-x64.zip
          generate_release_notes: true
